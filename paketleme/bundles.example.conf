# Bundle tanımları. Bu dosya varsa otomatik algılamayı TAMAMEN devre dışı bırakır.
# Kopyala: cp bundles.example.conf bundles.conf   (bundles.conf .gitignore'da)
#
#   define_bundle <ad> "<açıklama>" <kaynak>...
#   kaynak: dir:<yol>  |  file:<yol>[:<altdizin>]      (depo köküne göre)

define_bundle cekirdek "alan mantığı — mimari incelemesi için en önemli bundle" \
  dir:packages/core

define_bundle db "yalnız şema mimarisi — satır yok, seed yok" \
  dir:prisma \
  file:docs/VERI-PLANI.md

define_bundle docs "mimari ve kural bağlamı" \
  dir:docs file:README.md file:CLAUDE.md
